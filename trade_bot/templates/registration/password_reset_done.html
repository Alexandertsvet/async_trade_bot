{% extends 'base.html' %}

{% block title %}ПИСЬМО ОТПРАВЛЕНО // TRADING{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-10 col-sm-8 col-md-6 col-lg-5 text-center">
            <div class="card card-mono p-5 shadow-sm">
                <i class="bi bi-envelope-check fs-1 mb-3"></i>
                <h3 class="fw-bold mb-3 text-uppercase">Письмо отправлено</h3>
                <p class="small mb-2">Мы отправили вам инструкции по установке нового пароля на указанный email.</p>
                <p class="small text-muted mb-4">Если письмо не пришло, проверьте папку «Спам».</p>
                <a href="{% url 'user:login' %}" class="btn btn-outline-dark btn-mono rounded-0 fw-bold px-4 py-2 text-uppercase">На главную</a>
            </div>
        </div>
    </div>
{% endblock %}
